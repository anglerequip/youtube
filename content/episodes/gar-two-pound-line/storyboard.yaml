description: |
  In 2025 an angler on Lake Livingston, Texas, landed a 153-pound alligator gar on 2-pound test line (a pending IGFA
  line-class record). It works because a fish is about as dense as water, so in the water it weighs almost nothing,
  and the reel's drag lets line slip out before the tension reaches the line's breaking strength.

  #shorts #fishing #physics #science
