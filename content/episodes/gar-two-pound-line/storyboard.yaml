beats:
  - id: hook
    speaker: woman
    text: "An angler in Texas landed a hundred and fifty-three pound fish... on line rated for just *two* pounds."
    pause_after: 0.25
  - id: what
    speaker: wizard
    text: "Impossible. That line would snap instantly!"
    pause_after: 0.2
  - id: float
    speaker: woman
    text: "Not in water. A fish's body is about as dense as water, so down there it weighs almost nothing."
    pause_after: 0.2
  - id: pull
    speaker: woman
    text: "The line never has to lift it. It only has to handle the fish's pull."
    pause_after: 0.2
  - id: drag
    speaker: woman
    text: "And the reel has a brake, called the *drag*. Pull harder than its setting, and line slips out instead of snapping."
    pause_after: 0.2
  - id: swims
    speaker: wizard
    text: "So the fish just swims off with my line?"
    pause_after: 0.15
  - id: tired
    speaker: woman
    text: "Until it gets tired. You let it run, reel back in, and repeat. Again and again."
    pause_after: 0.2
  - id: lift
    speaker: woman
    text: "The one thing you never do is lift it by the line. Out of the water, it weighs every single one of those pounds."
    pause_after: 0.2
  - id: payoff
    speaker: wizard
    text: "Note to self... bigger net."
    pause_after: 0.0

caveats:
  - "The catch: a 153 lb (69 kg), 7 ft 3 in alligator gar on 2 lb test line, Lake Livingston, East Texas, April 2025 (Outdoor Life, 14 Apr 2025). It was reported as a pending IGFA line-class world record, not yet certified at the time of the article; IGFA called it the heaviest freshwater fish ever landed on 2 lb test."
  - "Near-neutral buoyancy: most bony fish, gars included, have a gas bladder and are close to the density of water, so their apparent weight in water is a small fraction of their weight in air. 'Almost nothing' is a simplification: it is small, not exactly zero."
  - "The line still feels the fish's swimming pull and the water drag on the fish; the reel's drag caps the tension. Our model fish (and its pull numbers) is illustrative, not data from this catch."
  - "Not shown: the record fish itself. The gar in the video is our own low-poly model, not footage or a likeness of the real catch."
sources:
