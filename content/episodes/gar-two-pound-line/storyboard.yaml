speed: 1.0
story:
  core_idea: "In water a fish weighs almost nothing, and the drag slips before the line can snap, so a thin line can tire out a huge fish."
  fascination: "a line that couldn't lift a bag of sugar landed a fish heavier than a person"
  steps: 4            # buoyancy; pull not weight; the drag slips below breaking strength; the fish tires itself out
  buildup: low
  extras: [twist]     # out of the water the full weight returns: never lift by the line
  payoff: payoff
