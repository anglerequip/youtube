slug: gar-two-pound-line
title: "A 153-Pound Fish on 2-Pound Line"
topic: "how anglers land fish many times heavier than their line's breaking strength: a fish is close to neutrally buoyant, so the line only resists its swimming pull; the reel's drag slips at a set tension below the line's strength, so the fish tires itself pulling line out; e.g. a 153 lb alligator gar on 2 lb test line, Lake Livingston, Texas, 2025 (pending IGFA line-class record)"
