description: |
  A cat that slips off a shelf upside down has nothing to push against, and physics says a body falling
  with no spin can't start spinning on its own. The cat doesn't. It bends in the middle and turns its
  front and back halves in opposite directions, tucking and stretching its legs so the halves cancel out.
  Total spin stays zero, and the cat still ends up feet down.

  Sources: Kane & Scher 1969 (Int. J. Solids and Structures); Marey 1894 photographs; Gbur, Falling Felines and Fundamental Physics (2019).

  #shorts #cats #physics #science
