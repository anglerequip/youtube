caveats:
  - "Zero spin: a cat dropped with no initial rotation has zero angular momentum and keeps it in free fall; it reorients by changing shape, not by acquiring net spin. Marey (1894) concluded from his photographs that the cat had no initial rotation and that air resistance played no role (summarised in the Falling cat problem literature)."
  - "The bend-and-twist model (two body halves that cannot twist about the spine, rotating about different axes) is Kane & Scher 1969. Real cats combine this with leg tuck/extend moves that change each half's moment of inertia; the tail helps a little but tailless cats can still right themselves."
  - "'Front half turns a lot, back half barely': one common illustration gives roughly 90 degrees vs 10 degrees; we keep it qualitative because exact angles vary from cat to cat."
  - "Age: the reflex begins to appear at about 3-4 weeks and is perfected at about 6-9 weeks (Sechzer et al. 1984, as cited in reviews)."
  - "No cat was dropped for this video. The falling cat is an original 3D animation of the published model, slowed down; it slips off a shelf onto a cushion. Cats can still be badly hurt in falls."
sources:
  - "T. R. Kane and M. P. Scher, 'A dynamical explanation of the falling cat phenomenon', International Journal of Solids and Structures 5(7), 663-670 (1969). doi:10.1016/0020-7683(69)90086-9"
  - "E.-J. Marey, 'Des mouvements que certains animaux exécutent pour retomber sur leurs pieds lorsqu'ils sont précipités d'un lieu élevé', Comptes Rendus 119, 714-717 (1894)."
  - "G. J. Gbur, Falling Felines and Fundamental Physics, Yale University Press (2019)."
  - "J. A. Sechzer et al., 'Development and maturation of postural reflexes in normal kittens', Experimental Neurology 86(3), 493-505 (1984)."

