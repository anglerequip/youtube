    description: |
      Shouting at fish barely works: for sound, water is about 3,600 times "harder to push" than air, so only about 0.1% of the sound energy gets through the surface. The rest bounces off. But drop a tackle box on the boat floor and the hull shakes the water directly. That sound goes straight in, and underwater it travels more than four times faster than in air.

