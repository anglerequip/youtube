slug: quiet-on-the-boat
title: "Shouting Barely Reaches Fish. A Dropped Tackle Box Does."
topic: "air and water have very different acoustic impedances (about 415 vs 1.48 million rayl, ratio ~3,600), so airborne sound hitting a water surface is almost all reflected: only about 0.1% of the energy crosses at normal incidence, and none beyond a ~13-15 degree critical angle; a vibrating boat hull is in contact with the water and couples its sound straight in, where sound travels ~4.3 times faster than in air"
