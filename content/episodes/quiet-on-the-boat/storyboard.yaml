description: |
  Sound in the air barely gets into water: water is about 3,600 times "stiffer" to sound than air, so about 99.9% of
  the sound energy reflects off the surface. A tackle box dropped on a boat floor is different: the hull touches the
  water and pushes the sound straight in, where it travels more than four times faster than in air.

  #shorts #fishing #sound #physics #science
