caveats:
  - "Physics: specific acoustic impedance Z = density x sound speed. Air about 1.2 kg/m3 x 343 m/s = 413 rayl; fresh water about 1000 x 1482 = 1.48 million rayl; ratio about 3,600 ('about three and a half thousand times harder to push')."
  - "Intensity transmission at normal incidence T = 4 Z1 Z2 / (Z1 + Z2)^2 = 0.0011, about 0.1% (-29.5 dB). At slanted incidence beyond the critical angle (about 13 degrees from vertical with these speeds; DOSITS quotes about 15 degrees) the sound is almost perfectly reflected (DOSITS, 'How does sound propagate from air into water?')."
  - "This is a plane-wave textbook result. Very loud sources close above the water (DOSITS: aircraft, rockets, near a wind turbine) still put measurable sound into the water; 'almost none' means the large majority reflects, not that fish can never detect a shout."
  - "Sound speed: about 1482 m/s in fresh water at 20 C vs 343 m/s in air, a ratio of 4.3 ('more than four times faster')."
  - "A dropped object on a hull: the hull is in direct contact with the water, so its vibration couples into the water without an air gap. We show the principle; we did not measure a particular boat."
  - "Fish hearing varies a lot by species; the video makes a physics point about how much sound enters the water, not a claim about any one species' hearing threshold."
sources:
  - "DOSITS (Discovery of Sound in the Sea, University of Rhode Island), 'How does sound propagate from air into water?', dosits.org/science/movement/how-does-sound-propagate-from-air-into-water (accessed 2026-11-21)"
  - "L. E. Kinsler, A. R. Frey et al., Fundamentals of Acoustics (4th ed., Wiley 2000), ch. 6: transmission at a boundary between two fluids"

