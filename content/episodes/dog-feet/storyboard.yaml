description: |
  Your dog sleeps on your feet, so it must be guarding you on "night watch", right? Half right.
  The pack-rank story came from captive wolves; wild packs are mostly families. But dogs really are
  light sleepers: filmed overnight, they woke about 23 times in 8 hours, and a bark outside gets more
  reaction than other sounds. The likely reasons for your feet: warmth, your smell, and a puppy-pile habit.

  Sources: Adams & Johnson 1993 and 1994 (Applied Animal Behaviour Science), Mech 1999 (Canadian Journal of Zoology).

  #shorts #dogs #dogbehavior #science #mythbusting
