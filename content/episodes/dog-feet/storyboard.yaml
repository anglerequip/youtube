caveats:
  - "Sleep figures: 24 pet dogs observed overnight in their homes (18 on video) averaged 23 sleep-wake episodes in 8 hours, about 16 minutes asleep and 5 minutes awake per cycle (Adams & Johnson 1993). A small sample; individual dogs vary."
  - "Barking: in a playback test with 12 dogs at night, dogs were more likely to bark or become more alert in response to recorded barking than to other sounds (owner-concern sounds, common urban sounds), and responded less when asleep than when alert (Adams & Johnson 1994). 'More reaction than other noises' summarises that comparison."
  - "Wolves: the alpha/dominance-rank picture came from captive wolves that were unrelated adults housed together; wild packs are usually a breeding pair and their offspring (Mech 1999). Some wild packs have more than one breeding pair, and dogs are not wolves, so neither model maps exactly onto a pet dog."
  - "Warmth, scent and social contact are the explanations behaviourists usually give for dogs sleeping against their owners; they are likely reasons, not measured motives. Young puppies huddle because they cannot yet regulate their body temperature well."
  - "We found no study of whether dogs sleeping on beds face the door; the video says so. Whether a dog 'thinks' it has a job is unknown."
  - "Our own wording; the topic came from a viral clip, whose explanation we test rather than repeat. The wizard, the woman and the dogs are original 3D characters."
sources:
  - "G. J. Adams and K. G. Johnson, 'Sleep-wake cycles and other night-time behaviours of the domestic dog Canis familiaris', Applied Animal Behaviour Science 36(2-3), 233-248 (1993). doi:10.1016/0168-1591(93)90013-F"
  - "G. J. Adams and K. G. Johnson, 'Behavioural responses to barking and other auditory stimuli during night-time sleeping and waking in the domestic dog (Canis familiaris)', Applied Animal Behaviour Science 39(2), 151-162 (1994). doi:10.1016/0168-1591(94)90135-X"
  - "L. D. Mech, 'Alpha status, dominance, and division of labor in wolf packs', Canadian Journal of Zoology 77, 1196-1203 (1999)."
  - "Scientific American, 'Is the Alpha Wolf Idea a Myth?' (accessed 2026-11-20)."

