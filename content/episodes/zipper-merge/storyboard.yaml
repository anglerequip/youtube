description: |
  The driver who stays in the closing lane right to the end and then merges? In heavy, slow traffic,
  that's what road agencies ask everyone to do. Merging early squeezes all the cars into one long queue
  next to an empty lane. Using both lanes and taking turns at the merge point (a zipper merge) can make
  the backup up to 40 percent shorter. Honest catch: Minnesota's transport department says it doesn't
  change your time through the work zone. It makes the queue shorter, evens out the two lanes and cuts
  risky lane-jumping. In light traffic, merge early.

  Sources: Minnesota DOT, "Late merge ... the Zipper System"; Wisconsin DOT, Zipper merge.

  #shorts #traffic #driving #science
