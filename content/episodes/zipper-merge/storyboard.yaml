caveats:
  - "Backup length: Wisconsin DOT says traffic backups can be reduced by as much as 40%; Minnesota DOT says 'up to 50% (40% is common)'. Neither page cites a study, so we use the more conservative 'up to forty percent'."
  - "Travel time: Minnesota DOT states the zipper system has no effect on travel time through the work zone; the benefits are a shorter queue, similar speeds in both lanes, fewer lane changes and less road rage."
  - "When: both agencies say the zipper applies when traffic is heavy and slow; at highway speeds with no backup, merge as soon as it is safe. Rules differ between countries and states; follow local signs."
  - "The road, cars and queues are our own 3D illustration of the agencies' description, not a measurement. The wizard and the woman are original 3D characters."
