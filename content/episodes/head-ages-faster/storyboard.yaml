# ---------------------------------------------------------------------------------------------
# Retention toolkit (factory/retention): every number below comes from the physics module via the plan.
retention:
  hud:
    - id: height                   # head-to-feet measuring line beside the figure
      type: dimension
      label: head to feet
      from: feet_mark
      to: head_mark
      value: {fact: height_m}
      format: "{v:.1f} m"
      show: [feet+0.3, feet.end]
      claims: [{claim: height, at: feet+1.5}]
    - id: lift                     # the 33 cm the NIST clock was raised
      type: dimension
      label: raised
      from: lab_low
      to: lab_high
      value: {frames: lift, scale: 100}
      format: "{v:.0f} cm"
      show: [proof@raised+0.2, proof.end]
      claims: [{claim: lift_hud, at: proof.end-0.3}]
    - id: years                    # the time-lapse: 80 years pass
      type: counter
      label: standing for
      value: {frames: years}
      format: "{v:.0f} years"
      at: [0.27, 0.2]
      show: [lifetime+0.3, lifetime.end+0.5]
      claims: [{claim: years_hud, at: lifetime.end+0.3}]
    - id: ahead                    # the head's lead, the real value
      type: counter
      label: head older by
      value: {frames: ns}
      format: "{v:.0f} ns"
      at: [0.63, 0.2]
      show: [lifetime+0.3, lifetime.end+0.5]
      claims: [{claim: lifetime_ns, at: lifetime.end+0.3}]
    - id: error                    # uncorrected GPS: the map error over one day
      type: counter
      label: map error
      value: {frames: err_km}
      format: "{v:.1f} km"
      at: [0.63, 0.2]
      show: [drift+0.1, end]
      claims: [{claim: gps_drift, at: end-0.2}]
    - id: hours
      type: counter
      label: uncorrected for
      value: {frames: hours}
      format: "{v:.0f} hours"
      at: [0.27, 0.2]
      show: [drift+0.1, end]
  cues:
    - {at: "lifetime.end+0.15", sfx: lock, gain: 0.16}     # after the last word of the payoff line (round 2 sound review)
