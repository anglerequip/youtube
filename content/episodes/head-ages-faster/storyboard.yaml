slug: head-ages-faster
title: "Your Head Is Older Than Your Feet"
topic: "general relativity / gravitational time dilation between your head and your feet"
component: custom   # physics: factory/simulation_engine/physics/time_dilation.py (weak-field g*h/c^2)
renderer: three
scene: clocks3d
hook_family: 1          # impossible-sounding claim that is literally true
structure: B            # surprising result -> mechanism -> proof -> consequence
description: |
  Gravity slows time, so the clocks at your feet tick a tiny bit slower than the clocks at your head.
  It's about one part in ten million billion per metre, and NIST measured it in 2010 by lifting an
  atomic clock just 33 cm. Visuals exaggerate the effect; every number is the real one.

  #shorts #physics #relativity #einstein #science
tags: [relativity, time dilation, gravity, einstein, atomic clock, physics, GPS, shorts]
voice: af_bella
speed: 1.1
story:
  core_idea: "Gravity slows time, so the feet, being closer to Earth, age a tiny bit slower than the head."
  fascination: "your own body is a relativity experiment, and someone actually measured it with clocks 33 cm apart"
  steps: 3            # gravity slows time; feet are deeper in it; how big the effect is
  buildup: medium
  extras: [history, scale]   # NIST 2010 makes it real; GPS shows the tiny number matters
  payoff: drift
  cut:
    - "why gravity slows time (equivalence principle, light climbing out of a well): a second video"
    - "Pound-Rebka 1959 and the 2022 millimetre measurement: true, but a second proof slows the build"
    - "GPS velocity correction (minus 7 microseconds a day): accurate detail, kept in the caveats"
    - "lying down a third of your life: in the caveats; the line already says 'stand upright'"
    - "closing joke ('ask them which end'): adds nothing after the payoff"
end_hold_s: 1.0
beats:
  - id: hook
    text: "Your head is older than your feet. And that's been *measured*."
    pause_after: 0.3
  - id: why
    text: "Gravity slows time. The deeper you sit in it, the slower every clock ticks."
  - id: feet
    text: "Your feet are closer to Earth's centre, so down there, time runs a little slower. Not just clocks. Everything."
  - id: small
    text: "How much slower? About one part in ten million billion... per metre."
  - id: proof
    text: "In twenty ten, physicists at NIST raised an atomic clock just thirty-three centimetres. And it ran *faster*, almost exactly as Einstein predicted."
    pause_after: 0.2
  - id: lifetime
    text: "Stand upright for eighty years, and your head ends up about half a millionth of a second older than your feet."
  - id: gps
    text: "Too small to matter? GPS satellites fly so high that their clocks gain about forty-five microseconds a day, from gravity alone."
  - id: drift
    text: "Ignore that, and your map would be off by kilometres in a single day."

caveats:
  - "The effect is real but tiny: about 1.1e-16 per metre of height near Earth's surface (g*h/c^2). Nobody can feel it."
  - "The half-a-millionth-of-a-second figure assumes standing upright (head about 1.7 m above the feet) for 80 years. Real people lie down for about a third of their lives, so the true difference is smaller."
  - "The NIST 2010 result was (4.1 ± 1.6) × 10^-17 for 33 cm, consistent with the predicted 3.6 × 10^-17 within its uncertainty; 'almost exactly' means within the error bar, not to many digits."
  - "GPS: the gravitational part is about +45 microseconds per day; the satellites' orbital speed takes off about 7, so the net correction is about 38 microseconds per day. The map-error counter is the narrated gravitational 45 µs/day times the speed of light (about 14 km per day); with the velocity part included the textbook figure is about 11 km per day. Real receiver errors depend on satellite geometry."
  - "On screen the slowdown is exaggerated by many orders of magnitude so it can be seen; the counters show the real values."
sources:
  - "C. W. Chou, D. B. Hume, T. Rosenband and D. J. Wineland, 'Optical Clocks and Relativity', Science 329, 1630-1633 (2010). doi:10.1126/science.1192720"
  - "NIST news release, 'NIST Pair of Aluminum Atomic Clocks Reveal Einstein's Relativity at a Personal Scale' (23 Sept 2010): about 90 billionths of a second over a 79-year lifetime for a 1-foot height difference."
  - "T. Bothwell et al., 'Resolving the gravitational redshift across a millimetre-scale atomic sample', Nature 602, 420-424 (2022). doi:10.1038/s41586-021-04349-7"
  - "N. Ashby, 'Relativity in the Global Positioning System', Living Reviews in Relativity 6, 1 (2003)."
  - "R. V. Pound and G. A. Rebka Jr., 'Apparent Weight of Photons', Physical Review Letters 4, 337 (1960)."

# ---------------------------------------------------------------------------------------------
# Single source of truth (factory/qa): every number heard or shown maps to a claim.
claims:
  - {id: rate_per_m, beat: small, unit: parts, sim: parts_per_m, scope: universal, tolerance: 0.15,
     evidence: {quality: 1, source: "Chou et al., Science 329, 1630 (2010): 'about 1.1 × 10^-16 per meter of change in height'; g/c^2 = 1.09e-16 per metre, i.e. one part in 9.2e15"}}
  - {id: nist_height, beat: proof, unit: cm, value: 33, scope: history,
     evidence: {quality: 1, source: "Chou et al. 2010; NIST release (23 Sept 2010): 33 centimeters"}}
  - {id: nist_year, card: "NIST, 2010", unit: year, value: 2010, scope: history,
     evidence: {quality: 1, source: "Chou et al., Science 329, 1630 (2010)"}}
  - {id: years, beat: lifetime, unit: count, value: 80, scope: condition}
  - {id: lifetime, beat: lifetime, unit: s, sim: lifetime_s, scope: condition, tolerance: 0.1,
     evidence: {quality: 1, source: "g h/c^2 x t with h = 1.7 m, t = 80 years = 4.7e-7 s; NIST scales the same formula to about 90 ns for 1 ft over 79 years"}}
  - {id: lifetime_ns, card: "468 ns", unit: ns, sim: lifetime_ns, scope: condition, tolerance: 0.02,
     evidence: {quality: 1, source: "same formula, shown on the live counter"}}
  - {id: years_hud, card: "80 years", unit: count, value: 80, scope: condition}
  - {id: height, card: "1.7 m", unit: m, sim: height_m, scope: condition,
     evidence: {quality: 2, source: "assumed head-above-feet height for a standing adult (stated on screen)"}}
  - {id: lift_hud, card: "33 cm", unit: cm, sim: nist_cm, scope: history, event: lift_33cm,
     evidence: {quality: 1, source: "Chou et al. 2010"}}
  - {id: gps_grav, beat: gps, unit: "µs", sim: gps_grav_us, scope: typical,
     evidence: {quality: 1, source: "Ashby, Living Rev. Relativ. 6, 1 (2003): gravitational frequency shift of GPS clocks vs the geoid ≈ +45.7 µs/day (velocity -7.1, net +38.6)"}}
  - {id: gps_drift, card: "13.7 km", unit: km, sim: gps_grav_km_per_day, scope: model, tolerance: 0.05,
     evidence: {quality: 2, source: "Ashby 2003: the gravitational 45.8 µs/day x speed of light = 13.7 km of range per day if that part were left uncorrected (net with the velocity part: 38.6 µs/day, 11.6 km); real receiver errors depend on geometry"}}

absolute_ok:
  - {beat: why, word: every, why: "the gravitational redshift is universal (equivalence principle): it applies to every clock, tested with many clock types"}
  - {beat: proof, word: exactly, why: "qualified as 'almost exactly'; measured (4.1 ± 1.6)e-17 vs predicted 3.6e-17, agreement within the error bar"}

