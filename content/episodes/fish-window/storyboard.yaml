description: |
  Underwater, a fish sees the whole sky, from horizon to horizon, squeezed into one circle overhead about 97 degrees
  wide. Light bends as it enters water, and even light skimming flat across the surface is bent down to about
  49 degrees from straight up. Outside that circle the surface acts like a mirror. An angler on the bank shows up
  squashed at the edge of the circle, which is why careful anglers keep low.

  #shorts #fishing #physics #light #science
