caveats:
  - "Physics: Snell's law with water's refractive index n = 1.333. Light arriving at grazing incidence (90 degrees from vertical) refracts to the critical angle arcsin(1/1.333) = 48.6 degrees, so the above-water hemisphere maps into a cone of 2 x 48.6 = 97.2 degrees (Wikipedia, 'Snell's window': 'compresses a 180 degree angle of view above water to a 97 degree angle of view below water'; some sources round to 96)."
  - "Window width at depth d is 2 d tan(48.6 deg) = 2.27 d, so 2.27 m at 1 m depth ('a little over two metres')."
  - "Outside the window, light from below is totally internally reflected, so the surface shows a reflection of the bottom (or is dark). With ripples, the window edge breaks up; the clean picture is for calm water."
  - "'Shows up squashed at the edge': objects near the horizon are compressed into a thin ring at the window's rim and dimmed by reflection losses. Keeping low (and back from the edge) is common angling advice; how much any given fish notices depends on species, distance, light and water clarity."
sources:
  - "Wikipedia, 'Snell's window' (accessed 2026-11-21): en.wikipedia.org/wiki/Snell%27s_window"
  - "E. Hecht, Optics (5th ed., Pearson 2017), sections 4.4 (refraction, Snell's law) and 4.7 (total internal reflection)"

