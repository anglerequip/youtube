slug: gamer-surgeons
title: "Surgeons Who Game Make Fewer Mistakes"
topic: "doctors who played video games over 3 hours a week made 37% fewer errors and were 27% faster in laparoscopic (keyhole) surgery drills (Rosser et al., Arch Surg 2007); a correlation, not proof"
component: custom   # the scene is renderer/scenes/gamersurgeons3d.js (shared home set)
renderer: three
scene: gamersurgeons3d
hook_family: 1          # a surprising claim
structure: D            # duo: claim -> disbelief -> what keyhole surgery is like -> why it resembles a game -> the study -> honest catch -> payoff
voice_clips: content/episodes/gamer-surgeons/voice   # duo voiced with ElevenLabs (wizard zYcjlYFOd3taleS0gkk3, woman 0ggs85h7hrWz8ExXnsBc)
max_inner_pause_s: 0.3
speakers: {wizard: zYcjlYFOd3taleS0gkk3, woman: 0ggs85h7hrWz8ExXnsBc}
description: |
  In a 2007 study of 33 doctors doing keyhole-surgery drills, the ones who had played video games for more
  than three hours a week made 37% fewer errors and finished 27% faster. Keyhole surgery means steering long
  tools through tiny openings while watching a flat screen, which is a lot like using a game controller.
  Honest catch: it's a correlation from one small study, not proof that gaming causes better surgery.

  Source: Rosser et al., "The impact of video games on training surgeons in the 21st century", Arch Surg 2007;142(2):181-186.

  #shorts #videogames #gaming #surgery #science
tags: [video games, gaming, surgery, brain, hand-eye coordination, science, shorts]
voice: elevenlabs-duo
speed: 1.0
story:
  core_idea: "Doctors who gamed made far fewer mistakes in keyhole-surgery drills, because the skill looks a lot like gaming."
  fascination: "a hobby people call a waste of time lines up with a surgeon's skill"
  steps: 3            # what keyhole surgery is; why it looks like a game; what the study measured
  buildup: low
  extras: []
  payoff: payoff
  cut:
    - "the top-tertile numbers (47% fewer errors, 39% faster): one strong number is enough, and it needs more caveats"
    - "the 'Top Gun' training programme's name: jargon"
    - "later studies with students: mixed results, a second video"
    - "named game titles from the study: game IP, not needed"
end_hold_s: 1.4
beats:
  - id: hook
    speaker: woman
    text: "Doctors who gamed more than three hours a week made *thirty-seven* percent fewer mistakes in surgery drills."
    pause_after: 0.25
  - id: what
    speaker: wizard
    text: "Wait. Video games make you a *better* surgeon?"
    pause_after: 0.2
  - id: keyhole
    speaker: woman
    text: "Think about keyhole surgery. You steer long tools through tiny holes... while watching a screen."
    pause_after: 0.2
  - id: flat
    speaker: woman
    text: "Your hands are down here. Your eyes are up there. And the picture is flat."
    pause_after: 0.2
  - id: gamer
    speaker: wizard
    text: "That sounds exactly like playing a *video game*."
    pause_after: 0.2
  - id: study
    speaker: woman
    text: "That's what one study tested, with thirty-three doctors. The gamers were also twenty-seven percent faster."
    pause_after: 0.2
  - id: catch
    speaker: wizard
    text: "So I should play more games!"
    pause_after: 0.2
  - id: honest
    speaker: woman
    text: "Careful. It's a link, not proof. People with quick hands might just enjoy games more."
    pause_after: 0.2
  - id: payoff
    speaker: wizard
    text: "Fine. Then I'm practising... for science."
    pause_after: 0.0

caveats:
  - "Study: Rosser et al. 2007 (Arch Surg 142:181-186), 33 surgical residents and attending physicians in a laparoscopic skills and suturing course (data from 2002). Those with past video game play over 3 hours a week made 37% fewer errors (P<.02) and were 27% faster (P<.03) than those who never played."
  - "It is a cross-sectional, correlational study with a small sample: it shows a link, not that gaming causes better surgical skill. The script says this out loud."
  - "'Doctors' = surgical residents and attending physicians, as in the abstract. The drills were training tasks on simulators, not operations on patients."
  - "The game on the TV in the video is an original abstract design; no real game, logo or character is shown."
sources:
  - "J. C. Rosser Jr et al., 'The impact of video games on training surgeons in the 21st century', Archives of Surgery 142(2):181-186 (2007). doi:10.1001/archsurg.142.2.181 (PubMed 17309970)"

