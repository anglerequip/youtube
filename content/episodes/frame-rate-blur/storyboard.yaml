description: |
  Movies run at 24 frames a second and look smooth. A video game at 24 looks choppy. The difference: a film
  camera's shutter stays open for about half of every frame (1/48 s), so anything moving is smeared along
  its path, and your brain blends the smears into motion. A game draws each frame perfectly sharp, so you
  see a frozen picture, a jump, another frozen picture. More frames make the jumps smaller, and because
  you're controlling the game, slow frames also make it react later.

  #shorts #videogames #gaming #fps #science
