title: "Why 24 FPS Looks Smooth in Movies but Choppy in Games"
topic: "a film camera's shutter is open for about half of each frame (180-degree shutter, 1/48 s at 24 fps), so motion is smeared and reads as smooth; a game renders instantaneous sharp frames, so at 24 fps you see discrete jumps; higher frame rates shrink the jumps, and interactivity adds latency"
