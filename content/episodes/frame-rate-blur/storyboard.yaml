caveats:
  - "Shutter: the film convention is a 180-degree shutter, i.e. each frame is exposed for half the frame interval (1/48 s at 24 fps). Cinematographers vary it for effect; 'half' is the standard, not a law."
  - "Games render each frame for a single instant unless a motion-blur effect is added in post-processing, which many games offer as an option."
  - "Sixty vs twenty-four: an object at the same speed moves 24/60 = 0.4 as far between frames at 60 fps, i.e. less than half the jump (our toy model checks this)."
  - "Forty-two milliseconds is the frame interval at 24 fps (1000/24 = 41.7 ms). Total input lag in a real game is usually longer (input, game logic, display); the frame interval is only one part of it."
  - "Interactivity is one reason; others include screen type (sample-and-hold LCD blur) and viewing distance. The video keeps to the two biggest."
  - "The slowed-down ball sequences are illustrations: the ball's speed and frame copies are drawn to scale with each other, not filmed."
sources:
  - "ARRI / American Cinematographer Manual: 180-degree shutter rule, exposure time = 1/(2 x frame rate)."
  - "UC Berkeley CS184 (2023), lecture 17 'Intro to animation': motion blur and temporal sampling in rendered vs filmed frames."
  - "Game Developer, 'Framerate and refresh: games and movies are not the same' (motion blur in film vs games)."

