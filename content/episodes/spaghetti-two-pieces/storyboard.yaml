slug: spaghetti-two-pieces
title: "Why Spaghetti Won't Snap in Two"
topic: "fracture / flexural waves: why dry spaghetti breaks into more than two pieces"
component: custom   # physics: factory/simulation_engine/physics/spaghetti.py (snap-back beam waves + fracture)
renderer: three
scene: spaghetti3d
hook_family: 5          # visual experiment (attention plan)
structure: B            # surprising result -> backwards explanation
description: |
  Bend a stick of dry spaghetti from both ends and it almost never breaks in two. The first crack
  sends a snap-back wave along each half that bends it even harder, so it cracks again. Twist it
  first and you get two pieces. Simulated with an elastic beam and a fracture threshold.

  #shorts #physics #science #spaghetti #experiment
tags: [spaghetti, fracture, physics, waves, experiment, science, shorts]
voice: af_bella
speed: 1.1
beats:
  - id: hook
    text: "Try snapping spaghetti in two. You almost never can."
    pause_after: 0.3
  - id: setup
    text: "Bend a dry stick from both ends, and it shatters into several pieces. Here, four of them."
  - id: wrong
    text: "You'd guess it snaps at a weak spot, and the extra bits are just bad luck."
  - id: slow
    text: "So slow it way down. The first crack opens near the middle, exactly as expected."
  - id: wave
    text: "But the instant it breaks, each half springs back, and a wave of extra bending races along it."
  - id: burst
    text: "Behind that wave, the stick bends even harder than when it first broke. So it cracks again."
  - id: rehook
    text: "Richard Feynman reportedly spent a whole evening trying to get just two pieces. He never managed it."
  - id: history
    text: "The snap-back explanation came in two thousand five, and it won an Ig Nobel Prize."
  - id: reveal
    text: "Then in two thousand eighteen, a team at MIT found the trick. Twist it first."
  - id: twist
    text: "Turn the stick almost a full turn, then bend it slowly."
  - id: result
    text: "Now it breaks cleanly in two."
  - id: why
    text: "Twisted, it snaps with much less bend stored inside. The twist unwinds in a flash, and the leftover wave is too weak to crack it again."
  - id: catch
    text: "Their model says about three quarters of a turn is enough. In the lab it took nearly a full one."
  - id: outro
    text: "So twist, then bend slowly. The first break doesn't have to cause the second."

caveats:
  - "Our simulation is a simplified elastic beam with a fracture threshold, in one bending plane. It tracks only the first extra crack in each half, so real sticks can break into even more pieces."
  - "Real fracture takes thousandths of a second; the snaps are shown slowed down."
  - "The twist is modelled with a simple combined-stress rule; the 270 degree and roughly 360 degree figures are from the 2018 paper, not from our simulation."
  - "The Feynman story is an anecdote (reported, not documented)."
sources:
  - "B. Audoly and S. Neukirch, 'Fragmentation of rods by cascading cracks: why spaghetti does not break in half', Physical Review Letters 95, 095505 (2005). Ig Nobel Prize in Physics 2006."
  - "R. H. Heisser, V. P. Patil, N. Stoop, E. Villermaux and J. Dunkel, 'Controlling fracture cascades through twisting and quenching', PNAS 115 (35), 8665-8670 (2018)."
  - "MIT News / ScienceDaily, 13 August 2018: 'MIT mathematicians solve age-old spaghetti mystery'."
  - "WBUR, 16 August 2018: the Feynman anecdote."
