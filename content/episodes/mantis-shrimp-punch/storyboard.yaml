description: |
  The peacock mantis shrimp smashes snail shells with a punch. Its club swings at up to 23 metres per
  second, underwater, because it doesn't use muscle speed: it latches the arm, loads a saddle-shaped spring
  and lets go. The club moves so fast that the water in front of it tears into vapour bubbles, and when
  they collapse they hit the shell a second time, with sound, heat and even faint flashes of light.

  Sources: Patek, Korff & Caldwell, Nature 2004; Patek lab, Duke University; UC Berkeley news release 2004.

  #shorts #animals #oceanlife #science #physics
