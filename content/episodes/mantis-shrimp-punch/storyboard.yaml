caveats:
  - "Speed: Patek, Korff & Caldwell (2004) filmed peak appendage speeds of 14 to 23 m/s in Odontodactylus scyllarus (UC Berkeley release); the Patek lab gives 12-23 m/s. 23 m/s is about 83 km/h, the top of the measured range."
  - "Mechanism: a latch holds the appendage while a saddle-shaped (hyperbolic paraboloid) part of the exoskeleton stores elastic energy; release drives the strike (Patek 2004; Patek lab: latch-mediated spring actuation). Muscles alone cannot produce these movements."
  - "Cavitation: the bubbles form where the water pressure drops near the fast-moving club. The Patek lab describes four force peaks per strike (appendage impact, bubble collapse, and the same again for the second appendage) and says the collapse produces heat, light and sound; the 2004 release was more cautious about light ('perhaps even light'). The light is faint and brief; no temperature figure is claimed here."
  - "'Less than a thousandth of a second': the Patek lab says the whole sequence of impacts and bubble collapses happens in less than 800 microseconds."
  - "Force: the Patek lab reports peak forces of about 1500 N, over 2500 times the animal's body weight; the 2004 release, from earlier experiments, said 'well over a hundred times'. Forces depend on the individual and the setup."
  - "The shrimp, the snail and the bubbles are our own 3D illustration, slowed down enormously; no footage is used. The wizard and the woman are original 3D characters."
sources:
  - "S. N. Patek, W. L. Korff and R. L. Caldwell, 'Deadly strike mechanism of a mantis shrimp', Nature 428, 819-820 (2004). doi:10.1038/428819a"
  - "Patek Lab, Duke University, 'Mechanics of movement: mantis shrimp', pateklab.biology.duke.edu (accessed 2026-11-20)."
  - "UC Berkeley News, 'Mantis shrimp's powerful punch ...', 21 Apr 2004, newsarchive.berkeley.edu/news/media/releases/2004/04/21_shrimp.shtml"

