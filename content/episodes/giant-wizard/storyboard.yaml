description: |
  What would happen if you were a hundred times taller?
  Every length grows a hundred times, so your volume and weight grow a million times. But a bone's strength
  depends on its cross-section, which grows only ten thousand times, so every bit of bone carries a hundred times
  the load. And with a million times more cells making heat but only ten thousand times more skin to lose it,
  you would overheat, even in Antarctica.

  #shorts #physics #science #squarecubelaw
