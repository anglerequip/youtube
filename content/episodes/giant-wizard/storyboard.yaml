caveats:
  - "Square-cube law (Galileo, Two New Sciences, 1638; Haldane, 'On Being the Right Size', 1926): scale every length by k = 100 and areas grow by k^2 = 10,000, volumes and so mass and weight by k^3 = 1,000,000. Compressive strength of a bone is proportional to its cross-sectional area, so the stress (force per area) in a geometrically scaled bone grows by k^3 / k^2 = k = 100."
  - "We assume the giant is the same wizard scaled up exactly (same proportions, same bone and tissue). Real large animals have proportionally thicker bones and a more upright posture; that is the point of the square-cube law, not a counterexample."
  - "Human femoral cortical bone fails in compression at roughly 170-200 MPa (Reilly & Burstein 1975). Peak bone stresses in vigorous movement leave a safety factor of only about 2-4 (Biewener 1990). A hundredfold stress is far past failure; tenfold (the 'ten times taller' button) is also past that safety margin, which is Haldane's point that a giant ten times our height would break his thigh bones at every step. 'Crunching' is the dramatised version: a real giant would not get the chance to stand up."
  - "Heat: the overheating line assumes his cells make heat like ours (same watts per kilogram), so heat output grows a million times while skin area grows ten thousand times, so every square metre of skin must shed a hundred times more heat (about 4,200 W/m2 instead of about 42 W/m2 at rest). Our estimate of the most cold Antarctic air (minus 30 C, 10 m/s wind) could carry away by convection plus radiation is about 1,300 W/m2, so he would keep heating up. Real big animals avoid this by burning less per kilogram (Kleiber's law: metabolism ~ mass^0.75; a whale's cells run slower than ours)."
  - "The steam and the melting snow around him are a visual metaphor for overheating; we do not model his skin temperature on screen."
sources:
  - "G. Galileo, Dialogues Concerning Two New Sciences (1638), Second Day: the bone of a giant animal (square-cube law)"
  - "J. B. S. Haldane, 'On Being the Right Size', Harper's Magazine, March 1926 (giants ten times our height would break their thigh bones at every step; heat loss and surface area)"
  - "A. A. Biewener, 'Biomechanics of mammalian terrestrial locomotion', Science 250 (1990) 1097-1103 (bone safety factors of about 2-4)"
  - "D. T. Reilly & A. H. Burstein, 'The elastic and ultimate properties of compact bone tissue', J. Biomechanics 8 (1975) 393-405 (cortical bone compressive strength ~190 MPa)"
  - "M. Kleiber, 'Body size and metabolism', Hilgardia 6 (1932) 315-353 (metabolic rate ~ mass^0.75 in real animals)"
  - "Resting heat output of an adult about 80 W, skin area about 1.9 m2 (standard physiology, e.g. Guyton & Hall, Textbook of Medical Physiology)"

