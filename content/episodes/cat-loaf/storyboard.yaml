caveats:
  - "Thermoneutral zone: domestic cats need no extra effort to stay warm at roughly 30-38 °C ambient (Wikipedia 'Cat', citing physiology literature), well above a typical heated room of about 18-22 °C. 'Comfy at around thirty degrees' is the lower end of that range; 'a fridge to her' is a joke, not a measurement."
  - "Heat loss and posture: animals reduce heat loss by curling up and tucking in extremities, which cuts the surface exposed to the air (postural thermoregulation, reviewed in Gilbert et al. 2010). Legs and tails are thin, so they have a lot of surface for their volume; 'the leakiest' is a simplification of that geometry, not a measured per-limb heat-loss figure."
  - "The on-screen '≈ 20% less surface' is our model, not a measurement on real cats: we computed the exposed fur area of our own 3D cat (renderer/cat_area.mjs), stretched out flat versus loafed, counting only surface not touching the floor and not hidden against the cat's own body. Real cats, coats and poses differ."
  - "Loafing and relaxation: a cat with its paws tucked under can't get up and run as quickly, and behaviour guides read the relaxed loaf as a sign the cat feels secure (International Cat Care; Bradshaw 2013). 'A little bit' trust is our framing; cats also loaf simply to rest."
  - "Pain: a hunched posture with the head lowered and narrowed or squinting eyes are items on validated feline pain scales (Feline Grimace Scale, Evangelista et al. 2019; Glasgow CMPS-Feline, Reid et al. 2017). They are warning signs, not a diagnosis; a vet decides."
  - "Our own wording and pictures. The wizard, the woman and the cat are original 3D characters; the thermal view is a stylised illustration, not a real thermal camera image."
sources:
  - "Wikipedia, 'Cat' (section on physiology: thermoneutral zone of the domestic cat about 30-38 °C), accessed 2026-11-20."
  - "C. Gilbert, D. McCafferty, Y. Le Maho, J.-M. Martrette, S. Giroud, S. Blanc and A. Ancel, 'One for all and all for one: the energetic benefits of huddling in endotherms', Biological Reviews 85(3), 545-569 (2010): postural and social thermoregulation, reduced exposed surface."
  - "International Cat Care, 'Cat body language' guidance (accessed 2026-11-20); J. Bradshaw, Cat Sense (Basic Books, 2013)."
  - "M. C. Evangelista, R. Watanabe, V. S. Y. Leung, B. P. Monteiro, E. O'Toole, D. S. J. Pang and P. V. Steagall, 'Facial expressions of pain in cats: the development and validation of a Feline Grimace Scale', Scientific Reports 9, 19128 (2019)."
  - "J. Reid, E. M. Scott, G. Calvo, A. M. Nolan, 'Definitive Glasgow acute pain scale for cats: validation and intervention level', Veterinary Record 180(18), 449 (2017)."

