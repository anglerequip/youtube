description: |
  Why do cats tuck their paws and tail under them and turn into a "loaf"? Mostly heat. Cats are comfiest
  at around 30 °C, so a normal living room is chilly to them, and legs and a tail lose heat fast. Folding
  them away means less surface open to the air. A loaf also means a relaxed cat, since it can't sprint off
  instantly. But a tense, hunched loaf with squinting eyes and the head down can be a pain sign: worth a vet check.

  Sources: Wikipedia "Cat" (thermoneutral zone), Gilbert et al. 2010 (Biological Reviews),
  International Cat Care, Bradshaw, Cat Sense (2013), Evangelista et al. 2019 (Scientific Reports), Reid et al. 2017.

  #shorts #cats #catbehavior #science
