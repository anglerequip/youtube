structure: B
description: |
  The wizard and Nyx cooked crystals. The police had questions. It was rock candy.

  Hot water near boiling can hold almost five times its own weight in sugar. Let it cool and it holds more
  than it should (supersaturated), so the extra sugar crystallises on a rough string over about a week,
  in flat-sided crystals because the molecules stack in a repeating pattern. And crack a sugar crystal in
  a really dark room: it gives off faint flashes of light (triboluminescence).

  No crimes were committed. Only candy.

  #shorts #science #chemistry #rockcandy #crystals #funny #comedy
