caveats:
  - "This is a comedy sketch about rock candy (sugar and water). Nothing in it is about drugs."
  - "Solubility of sucrose (CRC Handbook): about 487 g per 100 g of water at 100 C and about 204 g at 20 C, so near boiling water holds about 4.9 times its weight ('almost five times')."
  - "Rock candy usually takes about 5-10 days to grow; 'about a week' is the usual guidance. The growth on screen is our model (time constant two days), not a measurement."
  - "Sugar triboluminescence is real but faint: a dark-adapted eye in a very dark room sees small bluish flashes when sugar crystals crack. The flashes are drawn brighter so they read on a phone."
  - "The light comes mostly from nitrogen in the air, excited by the discharge between the oppositely charged crack faces."
  - "Characters, the house, the cars and the police are fictional."
sources:
