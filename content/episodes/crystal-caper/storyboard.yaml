  - "L. M. Sweeting, 'Light your candy', Towson University (triboluminescence of sugar and wintergreen candy)."
  - "L. M. Sweeting et al., 'Triboluminescence with and without air', Chemistry of Materials 13, 854-870 (2001)."
  - "F. Bacon, The Advancement of Learning (1605): sugar sparkles when scraped in the dark."

