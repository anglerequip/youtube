absolute_ok:
  - {word: "every", beat: crumbs, why: "'every crumb you ever dropped' is rhetorical: each rewarded stare reinforces the habit; caveat explains the learning effect"}
  - {word: "only", beat: crumbs, why: "'a reward that only comes sometimes' describes intermittent reinforcement, not an absolute claim"}
  - {word: "never", beat: purr, why: "'people who'd never owned a cat' describes the study's inexperienced listeners (McComb et al. 2009)"}

