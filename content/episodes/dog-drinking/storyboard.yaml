    pause_after: 0.0

caveats:
  - "Mechanism: high-speed footage of 19 pet dogs (13 filmed at owners' homes, 6 on campus) showed the tongue curling ventrally (backwards, toward the lower jaw), plunging in, then accelerating up to pull a water column; the dog bites down to capture it (Gart et al. 2015; Virginia Tech release). The release says dogs do not use the tongue to actively scoop water; some water stays in the curled tongue and is tossed aside."
  - "'Same trick, gentler' for cats: cats lightly touch the surface with the tongue tip and use the column too (earlier imaging by Jung and colleagues); the release contrasts cats' steady inertia with dogs' unsteady, faster acceleration. The cats line simplifies that comparison."
  - "We give no acceleration number: the only figure in the sources we could read ('2 to 4 g') is an outside researcher's comment, not a value from the paper."
  - "The slow-motion tongue, column and droplets in the video are our own 3D illustration of the published mechanism, not footage. The wizard, the woman and the dog are original 3D characters."
sources:
  - "S. Gart, J. J. Socha, P. P. Vlachos and S. Jung, 'Dogs lap using acceleration-driven open pumping', Proceedings of the National Academy of Sciences (December 2015)."
  - "Virginia Tech News, 'Engineers discover precise mechanism underlies the sloppy way dogs raise water into their mouths', 15 Dec 2015, news.vt.edu/articles/2015/12/121515-engineering-dogresearch.html"

