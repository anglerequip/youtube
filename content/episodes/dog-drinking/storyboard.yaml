speakers: {wizard: zYcjlYFOd3taleS0gkk3, woman: 0ggs85h7hrWz8ExXnsBc}
description: |
  Your dog doesn't scoop water with its tongue. It curls the tongue backwards, slaps the surface,
  yanks it up so fast that a column of water follows, then bites the top of that column off.
  Researchers filmed 19 dogs to work it out. Cats touch the surface gently; dogs hit it hard, and the
  leftover water in the curled tongue is the mess on your floor.

  Sources: Gart, Socha, Vlachos & Jung, PNAS 2015; Virginia Tech news release, 15 Dec 2015.

  #shorts #dogs #science #physics
