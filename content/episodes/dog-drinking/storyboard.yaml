speed: 1.0
story:
  core_idea: "A dog drinks by flicking up a column of water and biting it, not by scooping."
  fascination: "the tongue curls the 'wrong' way, backwards, and the water is caught in mid-air"
  steps: 3            # backwards curl; fast pull makes a column; the jaw bites the column
  buildup: low
  extras: [twist]     # cats do the same trick, gently
  payoff: payoff
