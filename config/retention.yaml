# Retention toolkit (factory/retention): defaults for the storyboard `retention:` block.
# Everything here is opt-in per episode. An episode with no `retention:` block renders exactly as before.
# Evidence for each feature: docs/RETENTION.md (techniques library). Hypotheses, not proven lifts.

features:                 # master switches; an episode can override any of them under retention.features
  hud: true               # counters, meters, dimension lines, tracked callouts, question chips
  cues: true              # storyboard-declared sound / music / camera cues bound to beats, words and HUD events
  auto_accents: false     # automatic soft accents when a card or HUD widget appears (A/B candidate)
  caption_emphasis: none  # none | weight: *stressed* words drawn bolder (Blueprint 6 forbids colour highlights)

# Platform-safe layout, as fractions of the 1080x1920 frame (0,0 = top left).
# TikTok and YouTube Shorts both overlay: status/search at the top, an action rail on the right
# (like/comment/share) and title/description/music at the bottom. Keep HUD inside `safe`.
safe:
  x: [0.06, 0.84]         # right rail starts at about 85% width on both apps
  y: [0.075, 0.66]        # top status/search row; bottom: captions (0.69-0.77) then the app's own text
caption_band: [0.68, 0.78]
reserved:                 # screen areas other overlays already own
  badge: [0.070, 0.106]   # y band of the playback-speed badge (renderer/world.js drawBadge); width follows its text

# Named slots for screen-anchored widgets (centre x, centre y). Cards use y=0.17 by convention.
slots:
  top_left:   [0.22, 0.135]
  top_right:  [0.68, 0.135]
  top_center: [0.45, 0.135]
  mid_left:   [0.20, 0.40]
  mid_right:  [0.70, 0.40]

limits:
  max_widgets: 2          # screen-anchored HUD widgets visible at once (Blueprint 7: sparing, no clutter)
  max_overlays: 3         # widgets + label cards + tracked callouts visible at once
  min_dwell_s: 1.5        # a widget must stay long enough to be read
  callout_onscreen_share: 0.85   # a tracked callout's anchor must be in frame this share of its time
  question_min_gap_s: 4.0        # a question chip should stay open at least this long before its answer
  question_max_gap_s: 45.0

style:                    # Blueprint 7: off-white card + one strong colour
  card: "#e5e2d6"
  ink: "#2b2b2b"
  accent: "#c92a2e"
  muted: "#6d675c"
  line: "#ffffff"

ticks:                    # counter ticks (sound): rate-limited, varied, routed through factory/qa/sound.py
  # keep them rare: 4+ evenly spaced cues of one name is a 'metronome' to the sound QA (sound.periodic, click_train)
  sfx: blip
  max: 3
  max_rate_hz: 4.0
  gain: 0.12

accents:                  # used by auto_accents and by `cue: accent`
  appear: {sfx: blip, gain: 0.22}
  threshold: {sfx: lock, gain: 0.35}
  answer: {sfx: lock, gain: 0.3}
