# Recipe thresholds. Starting hypotheses from docs/research (PR #1); tune with real results.
# Sources: SCRIPT_ENGINE_SPECIFICATION (SC-*), TEXT_AND_CAPTION_DESIGN_SYSTEM (TX-*, CP-*),
#          MOTION_DESIGN_SYSTEM (MD-*, CAM-*), HOOK_ENGINE_SPECIFICATION (HK-*).
script:
  # No length target and no beat count (Caesar, 2026-11-19 evening, replacing the "over 60 s" rule):
  # content decides duration. See `length:` below and factory/story_length.py.
  wpm_target: [150, 185]         # SC-2
  wpm_warn: [140, 200]
  beat_wpm_max: 210              # SC-3
  sentence_words_max: 18         # SC-4
  beat_words_max: 30             # SC-5
  first_claim_by_s: 3.0          # SC-7 / HK-3 (fail)
  voice_starts_by_s: 0.3         # hook spec
  takeaway_min_s: 2.5            # SC-10 (fail)
  final_hold_s: 0.8
  absolutes: [always, never, every, impossible, all, "no one", instantly, "at all", "not even a little"]
  fillers: [basically, actually, literally, really, "so yeah", "kind of", "you know"]
  filler_max: 1
  allow_cta: false               # SC-22 warn when false
  cta_words: [follow, subscribe, like]
delivery:                        # SCRIPT spec 5.1: pace -> speed multiplier and extra pause
  brisk: {speed: 1.05, pause: 0.0}
  calm: {speed: 1.0, pause: 0.0}
  build: {speed: 1.03, pause: 0.0}
  reveal: {speed: 0.95, pause: 0.5}
  hold: {speed: 1.0, pause: 0.0}
text:
  max_roles_visible: 2
  max_words_on_screen: 9
  max_cards_visible: 1
  card_min_dwell_s: 2.0
  card_dwell_per_word_s: 0.3
  caption_band: [0.69, 0.77]
  focal_zone: [0.20, 0.66]
captions:
  mode: full
  center_y: 0.73                 # from top (Blueprint)
  max_words_per_chunk: 3
  max_chars_per_chunk: 16
  min_chunk_s: 0.6
  max_cps: 17
  clear_after_word_s: 0.15
  hide_in_pauses_over_s: 0.4
  font: Poppins SemiBold
  cap_height_frac: 0.030
motion:
  max_event_gap_s: 3.0           # MD-1
  max_event_gap_explain_s: 2.5   # MD-2
  min_cut_gap_s: 1.2             # MD-5 (fail)
  typical_cut_s: [7.0, 12.0]       # measured on the style reference: 5 hard cuts in 60.5 s; camera moves inside shots
  no_cut_reveal_s: 1.5           # MD-8 (fail)
  reveal_camera_still_s: 1.0     # CAM-5

# Story length (factory/story_length.py). Content decides duration: these numbers only describe how
# long a part of a story usually takes to say, and when a script looks padded. None of them is a target,
# and nothing pads or trims a video to reach one.
length:
  words_per_s_at_speed_1: 3.05   # house voice incl. sentence pauses (Kokoro timelines: 3.2-3.5 w/s at 1.1)
  parts_s:                       # natural cost of each story part, for the pre-writing estimate
    hook: 3.0
    step: 7.0                    # one explanation step the viewer genuinely needs
    extra: 5.0                   # one optional layer that earns its place (history, twist, scale...)
    payoff: 5.0
    ending: 2.0
  recap_warn: 0.6                # recap score (story_length.recap_score) -> "recap?" (polish)
  recap_block: 0.72              # ... -> high: repair before approval
  max_words_after_payoff: 30     # a decisive ending, not a tour of extras...
  after_payoff_share: 0.15       # ...and at most this share of the script's words (never under 12)
  min_rel_speed: 0.94            # slower than this (not a reveal) stretches the voice
  max_rel_speed: 1.12            # faster than this crams a script that should be cut
  max_pause_s: 0.8               # pause after a beat that isn't a reveal
  max_pause_share: 0.15          # all script pauses vs narration time
  long_vs_estimate: 1.4          # soft: much longer than the story's own plan
  short_vs_estimate: 0.6         # soft: much shorter (explanation may be incomplete)
  max_tail_s: 2.6                # video after the last word (end hold + music fade + loop frame)

# Platform programmes with their own duration rules. All OFF by default; switch one on per storyboard
# (`platforms: {tiktok: {creator_rewards: true}}`). They only report; they never change the script.
platforms:
  tiktok:
    creator_rewards: false       # TikTok Creator Rewards pays only for videos over 1 minute
    creator_rewards_min_s: 60.0
