name: publish

# Posts queued videos to YouTube as scheduled (private until their publish time), then posts at most one
# Facebook reel a day from the Facebook queue (18:00 Stockholm). Uses only the repository's Actions
# secrets; no PC is involved. Runs on a schedule and on demand.
on:
  schedule:
    - cron: "15 * * * *"        # hourly, at :15
  workflow_dispatch:
    inputs:
      facebook_now:
        description: "Slug of a queued video to post to Facebook right now (skips the daily 18:00 slot)"
        required: false
        default: ""

permissions:
  contents: write               # to commit the queue clean-up

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the YouTube and HTTP clients only
        run: pip install "google-api-python-client>=2.100" "google-auth>=2.23" "google-auth-oauthlib>=1.1" "requests>=2.31" tzdata
      - name: Post due videos
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: python -m factory.autopilot.cloud_post
      - name: Post the day's Facebook reel
        if: always()
        env:
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          FACEBOOK_POST_NOW: ${{ github.event.inputs.facebook_now }}
        run: python -m factory.autopilot.facebook_post
      - name: Remove posted queue folders from the repository
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "autopilot@users.noreply.github.com"
          git add -A autopilot_queue autopilot_queue_facebook content/ledger
          git diff --cached --quiet || (git commit -m "autopilot: clean up posted videos and update the topic ledger" && (git push || (git pull --rebase && git push)))
