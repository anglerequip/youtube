- id: T003
  working_title: The tap that stops car thirty
  topic_family: traffic
  scientific_question: Why does a light brake tap become a full stop thirty cars back?
  explanation: Each follower reacts late and brakes a little harder, so the disturbance grows as it travels upstream
    (string instability).
  misconception: A small tap fades out behind you.
  key_visual_moment: Brake glow growing brighter as it travels back along a highway
  candidate_hooks:
